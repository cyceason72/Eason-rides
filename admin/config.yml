# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: cyceason72/Eason-rides
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c3eb2bbd-7a55-4c7d-87dc-8a0fa6e67017/pkce
  auth_token_endpoint: /sites/c3eb2bbd-7a55-4c7d-87dc-8a0fa6e67017/token
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://eason-rides.vercel.app

# 圖片/影片上傳後會被存進這個資料夾，網站程式碼也是從這裡讀取
media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "gallery"
    label: "旅行相簿 Albums"
    files:
      - name: "gallery"
        label: "相簿列表"
        file: "content/gallery.json"
        fields:
          - label: "相簿（每一趟出門是一個相簿）"
            name: "albums"
            widget: "list"
            summary: "{{fields.date}} — {{fields.location}}"
            fields:
              - { label: "日期", name: "date", widget: "string", hint: "格式範例：2026 · 06 · 08" }
              - { label: "地點（選填）", name: "location", widget: "string", required: false, default: "" }
              - { label: "心得（選填）", name: "note", widget: "text", required: false, default: "" }
              - label: "照片／影片（第一個會當封面）"
                name: "media"
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - { label: "類型", name: "type", widget: "select", options: ["image", "video"], default: "image" }
                  - { label: "檔案", name: "src", widget: "file" }

  - name: "panning"
    label: "追焦紀錄 Panning"
    files:
      - name: "panning"
        label: "追焦紀錄照片列表"
        file: "content/panning.json"
        fields:
          - label: "照片"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "照片", name: "image", widget: "image" }
              - { label: "說明文字（選填）", name: "caption", widget: "string", required: false, default: "" }
              - { label: "Alt 文字（選填）", name: "alt", widget: "string", required: false, default: "" }

  - name: "journal"
    label: "Ride Journal 旅程紀錄"
    files:
      - name: "journal"
        label: "旅程列表"
        file: "content/journal.json"
        fields:
          - label: "旅程"
            name: "entries"
            widget: "list"
            summary: "{{fields.location}} — {{fields.date}}"
            fields:
              - label: "媒體（照片/影片，可加多個，第一個會當封面）"
                name: "media"
                widget: "list"
                summary: "{{fields.type}}"
                fields:
                  - { label: "類型", name: "type", widget: "select", options: ["image", "video"], default: "image" }
                  - { label: "檔案", name: "src", widget: "file" }
              - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "年份（要跟日期年份一致，用於篩選按鈕）", name: "year", widget: "number", value_type: "int" }
              - { label: "地點", name: "location", widget: "string" }
              - { label: "公里數", name: "km", widget: "number", value_type: "int" }
              - { label: "心得", name: "note", widget: "text" }
              - label: "標籤"
                name: "tags"
                widget: "list"
                field: { label: "標籤", name: "tag", widget: "string" }
                required: false

  - name: "videos"
    label: "Videos 影片紀錄"
    files:
      - name: "videos"
        label: "影片列表"
        file: "content/videos.json"
        fields:
          - label: "影片"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "縮圖", name: "thumbnail", widget: "image" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "長度（例如 08:24）", name: "duration", widget: "string" }
              - { label: "平台", name: "platform", widget: "select", options: ["YouTube", "Reels"], default: "YouTube" }
              - { label: "連結網址", name: "url", widget: "string" }
